<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UpRiver</title>
<style>
:root {
  color-scheme: light dark;
  /* neutral ramp (light) — palette.mjs seed 190 muted */
  --neutral-1: #fcfdfd; --neutral-2: #f7f9f9; --neutral-3: #eef1f1; --neutral-4: #e4e9e9;
  --neutral-5: #d8e0df; --neutral-6: #cbd4d4; --neutral-7: #bbc6c5; --neutral-8: #a1aead;
  --neutral-9: #abbbba; --neutral-10: #99a8a7; --neutral-11: #5d6564; --neutral-12: #2a2f2e;
  /* accent ramp (light) — the ONE brand color */
  --accent-1: #fafefd; --accent-2: #f4fafa; --accent-3: #e6f4f3; --accent-4: #d8edeb;
  --accent-5: #c9e5e2; --accent-6: #b7dbd8; --accent-7: #a2ceca; --accent-8: #82b7b2;
  --accent-9: #84c6c1; --accent-10: #74b2ad; --accent-11: #486b68; --accent-12: #203230;
  --accent-on-solid: #04100f;
  /* functional (light) — palette.mjs seed 190 balanced */
  --error-3: #ffebe9; --error-9: #e1524f; --error-11: #974843;
  --success-3: #e0f8e0; --success-9: #5ad664; --success-11: #337437;
  --warning-3: #f9f0dd; --warning-9: #dbb155; --warning-11: #76602f;
  --info-3: #e3f3ff; --info-9: #5baee5; --info-11: #3d6886;

  /* semantic: surfaces + text */
  --bg: var(--neutral-3);            /* page ground, top bar */
  --surface: var(--neutral-1);       /* panels */
  --sunken: var(--neutral-2);        /* selected stage cell, hover rows */
  --rule: var(--neutral-7);          /* ledger hairlines (decorative) */
  --rule-strong: var(--neutral-11);  /* input/control boundaries (>=3:1) */
  --text: var(--neutral-12);
  --text-2: var(--neutral-11);
  /* semantic: the accent */
  --accent-solid: var(--accent-11);  /* primary button fill */
  --on-accent: var(--neutral-1);
  --accent-text: var(--accent-11);   /* links */
  --accent-subtle: var(--accent-3);  /* current sidebar item */
  --mark-tile: var(--accent-11); --mark-ink: var(--neutral-1);
  /* focus */
  --focus-ring: var(--accent-11); --focus-ring-width: 2px; --focus-ring-offset: 2px;
  /* alias tier, Phase 3: intent names. Components reference ONLY this tier (and the scale tokens below). */
  --background: var(--bg);
  --border: var(--rule); --border-strong: var(--rule-strong);
  --text-muted: var(--text-2);
  --hover: var(--sunken);
  --skeleton: var(--neutral-4);
  --accent-solid-hover: var(--accent-12);
  --danger-solid: var(--error-11); --on-danger: var(--neutral-1);
  --danger-text: var(--error-11);  --danger-bg: var(--error-3);
  --disabled-bg: var(--neutral-4); --disabled-text: var(--neutral-11);
  --scrim: rgb(18 19 19 / .45);
  /* status */
  --st-passed: var(--success-11);  --st-passed-text: var(--success-11);
  --st-failed: var(--error-9);     --st-failed-text: var(--error-11); --st-failed-bg: var(--error-3);
  --st-running: #226a95;           --st-running-text: #226a95; /* vivid-run info-11, see Status set */
  --st-aborted: var(--neutral-12); --st-aborted-text: var(--neutral-12);
  --st-idle: var(--neutral-11);    --st-idle-text: var(--neutral-11);
  --st-glyph: var(--surface);
  /* status aliases: the names components use (bridge to the locked --st-* values) */
  --status-passed: var(--st-passed);   --status-passed-text: var(--st-passed-text);
  --status-failed: var(--st-failed);   --status-failed-text: var(--st-failed-text); --status-failed-bg: var(--st-failed-bg);
  --status-running: var(--st-running); --status-running-text: var(--st-running-text);
  --status-aborted: var(--st-aborted); --status-aborted-text: var(--st-aborted-text);
  --status-idle: var(--st-idle);       --status-idle-text: var(--st-idle-text);
  --status-glyph: var(--st-glyph);
  --status-info-text: var(--info-11);  --status-info-bg: var(--info-3);
  --status-warning-text: var(--warning-11); --status-warning-bg: var(--warning-3);
  /* console — dark in both themes (dark-ramp hexes, verbatim) */
  --con-bg: #191a1a; --con-text: #e3e9e9; --con-gutter: #b0bab9; --con-rule: #424b4a;
  --con-err-bg: #331a18; --con-err-text: #f49c95; --con-err-mark: #e1524f;
  --con-hit-bg: #dbb155; --con-hit-text: #191a1a;
  --ansi-red: #f49c95; --ansi-green: #88cb8a; --ansi-yellow: #cdb482; --ansi-blue: #90bedf; --ansi-cyan: #9ac0bd;

  /* type */
  --font-ui: system-ui, -apple-system, "Segoe UI", "Helvetica Neue", sans-serif;
  --font-data: ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
  --text-xs: 12px; --text-sm: 12px; --text-base: 14px; --text-lg: 15px;
  --text-xl: 17px; --text-2xl: 20px; --text-3xl: 24px; --text-4xl: 28px;
  --leading: 1.45; --leading-tight: 1.2; --leading-log: 1.5;
  --numeric: tabular-nums;
  /* space, shape */
  --sp-1: 2px; --sp-2: 4px; --sp-3: 8px; --sp-4: 12px; --sp-5: 16px; --sp-6: 24px; --sp-7: 32px;
  --radius: 0; --radius-control: 2px; --rule-w: 1px;
  --shadow-overlay: 0 6px 16px rgb(32 50 48 / .18); /* menus + dialogs only, accent-12 tinted */
  --hit: 44px; --hit-nav: 44px; /* coarse pointer / unknown; fine pointers below */
  /* motion */
  --dur-fast: 120ms; --dur: 200ms; --ease: cubic-bezier(.2, 0, 0, 1); --spin: 1.1s;
}
@media (prefers-color-scheme: dark) {
  :root {
    --neutral-1: #121313; --neutral-2: #191a1a; --neutral-3: #202322; --neutral-4: #272b2b;
    --neutral-5: #2e3433; --neutral-6: #363e3d; --neutral-7: #424b4a; --neutral-8: #576362;
    --neutral-9: #abbbba; --neutral-10: #bfcecd; --neutral-11: #b0bab9; --neutral-12: #e3e9e9;
    --accent-1: #111313; --accent-2: #161a1a; --accent-3: #1a2424; --accent-4: #1d2e2c;
    --accent-5: #203736; --accent-6: #234240; --accent-7: #29514e; --accent-8: #386b67;
    --accent-9: #84c6c1; --accent-10: #9ad9d4; --accent-11: #9ac0bd; --accent-12: #d7edeb;
    --accent-on-solid: #04100f;
    --error-3: #331a18; --error-9: #e1524f; --error-11: #f49c95;
    --success-3: #152715; --success-9: #5ad664; --success-11: #88cb8a;
    --warning-3: #282113; --warning-9: #dbb155; --warning-11: #cdb482;
    --info-3: #17242d; --info-9: #5baee5; --info-11: #90bedf;

    --bg: var(--neutral-1); --surface: var(--neutral-2); --sunken: var(--neutral-3);
    --rule: var(--neutral-7); --rule-strong: var(--neutral-11);
    --text: var(--neutral-12); --text-2: var(--neutral-11);
    --accent-solid: var(--accent-9); --on-accent: var(--accent-on-solid);
    --accent-text: var(--accent-11); --accent-subtle: var(--accent-3);
    --mark-tile: var(--accent-9); --mark-ink: var(--accent-on-solid);
    --focus-ring: var(--accent-9);
    --accent-solid-hover: var(--accent-10);
    --danger-solid: var(--error-9); --on-danger: var(--accent-on-solid);
    --danger-text: var(--error-11); --danger-bg: var(--error-3);
    --disabled-bg: var(--neutral-4); --disabled-text: var(--neutral-11);
    --skeleton: var(--neutral-4);
    --scrim: rgb(0 0 0 / .6);
    --st-passed: var(--success-9);   --st-passed-text: var(--success-11);
    --st-failed: var(--error-9);     --st-failed-text: var(--error-11); --st-failed-bg: var(--error-3);
    --st-running: var(--info-9);     --st-running-text: var(--info-11);
    --st-aborted: var(--neutral-12); --st-aborted-text: var(--neutral-12);
    --st-idle: var(--neutral-11);    --st-idle-text: var(--neutral-11);
    --st-glyph: var(--surface);
    --shadow-overlay: 0 6px 16px rgb(0 0 0 / .5);
  }
}
@media (min-width: 701px) {
  :root { --text-xs: 11px; --text-sm: 12px; --text-base: 13px; }
}
@media (pointer: fine) {
  :root { --hit: 32px; --hit-nav: 36px; }
}
</style>
<style>
:root {
  /* button */
  --btn-h: var(--hit); --btn-px: var(--sp-4); --btn-radius: var(--radius-control);
  --btn-bg: var(--surface); --btn-fg: var(--text); --btn-bd: var(--border-strong); --btn-bg-hover: var(--hover);
  --btn-primary-bg: var(--accent-solid); --btn-primary-fg: var(--on-accent); --btn-primary-bg-hover: var(--accent-solid-hover);
  --btn-danger-bg: var(--danger-solid); --btn-danger-fg: var(--on-danger);
  --btn-off-bg: var(--disabled-bg); --btn-off-fg: var(--disabled-text);
  /* field: input, select, textarea */
  --field-h: var(--hit); --field-bg: var(--surface); --field-fg: var(--text); --field-bd: var(--border-strong);
  --field-bd-error: var(--danger-text); --field-error: var(--danger-text); --field-hint: var(--text-muted);
  --field-off-bg: var(--disabled-bg); --field-off-fg: var(--disabled-text);
  /* checkbox, toggle */
  --check-size: 18px; --check-bd: var(--border-strong); --check-on-bg: var(--accent-solid); --check-on-fg: var(--on-accent);
  /* status ball + stamp */
  --ball-size: 16px; --ball-size-lg: 20px; --stamp-bd-w: 1.5px;
  /* stage cell + Stage View grid */
  --cell-min: 136px; --cell-bg: var(--surface); --cell-bd: var(--border); --cell-bg-hover: var(--hover);
  --cell-sel-bg: var(--sunken); --cell-sel-ring: var(--text);
  --cell-failed-bg: var(--status-failed-bg); --cell-failed-rule: var(--status-failed); --cell-failed-ring: var(--status-failed-text);
  /* sidebar + breadcrumbs */
  --nav-w: 200px; --nav-h: var(--hit-nav); --nav-bg: var(--surface); --nav-bd: var(--border); --nav-bg-hover: var(--hover);
  --nav-cur-bg: var(--accent-subtle); --nav-cur-mark: var(--accent-solid); --nav-off-fg: var(--text-muted);
  --crumb-fg: var(--text-muted); --crumb-link: var(--accent-text);
  /* table */
  --tbl-row-h: var(--hit); --tbl-head-fg: var(--text-muted); --tbl-rule: var(--border);
  --tbl-row-hover: var(--hover); --tbl-changed-bg: var(--accent-subtle);
  /* console */
  --log-bg: var(--con-bg); --log-fg: var(--con-text); --log-gutter: var(--con-gutter); --log-rule: var(--con-rule);
  --log-err-bg: var(--con-err-bg); --log-err-fg: var(--con-err-text); --log-err-mark: var(--con-err-mark);
  --log-hit-bg: var(--con-hit-bg); --log-hit-fg: var(--con-hit-text); --log-max-h: 320px;
  /* banner, dialog, dropzone, empty state, trend strip, skeleton */
  --banner-error-bg: var(--danger-bg); --banner-error-fg: var(--danger-text);
  --banner-info-bg: var(--status-info-bg); --banner-info-fg: var(--status-info-text);
  --banner-warn-bg: var(--status-warning-bg); --banner-warn-fg: var(--status-warning-text);
  --dialog-bg: var(--surface); --dialog-bd: var(--border-strong); --dialog-shadow: var(--shadow-overlay); --dialog-scrim: var(--scrim);
  --drop-bg: var(--surface); --drop-bd: var(--border-strong); --drop-active-bg: var(--accent-subtle); --drop-active-bd: var(--accent-solid);
  --empty-fg: var(--text-muted);
  --strip-h: 32px; --strip-bar-w: 12px; --strip-base: var(--border-strong);
  --skel-bg: var(--skeleton);
}
</style>
<style>
/* components: mobile-first, tokens only (DESIGN.md ## Components) */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:var(--text-base)/var(--leading) var(--font-ui);background:var(--background);color:var(--text)}
.num{font-variant-numeric:var(--numeric)}
.data{font-family:var(--font-data);font-size:var(--text-sm)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
a{color:var(--accent-text);text-underline-offset:2px}
a:not(:hover){text-decoration:none}
:focus-visible{outline:var(--focus-ring-width) solid var(--focus-ring);outline-offset:var(--focus-ring-offset)}
svg{display:block;flex:none}
.ico{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
kbd{font:600 var(--text-xs)/1 var(--font-ui);padding:2px 5px;border:1px solid var(--border-strong);border-radius:var(--radius-control);color:var(--text-muted);background:var(--surface)}
.skip{position:absolute;left:-999px;top:0}
.skip:focus{left:var(--sp-3);top:var(--sp-3);background:var(--surface);padding:var(--sp-2) var(--sp-3);z-index:3}

/* top bar */
.top{display:flex;flex-wrap:wrap;gap:var(--sp-3) var(--sp-5);align-items:center;padding:var(--sp-3) var(--sp-5);background:var(--surface);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:var(--rule-w);background:var(--border)}
.brand{display:flex;gap:var(--sp-3);align-items:center;font-weight:700;font-size:var(--text-lg);letter-spacing:.01em;color:var(--text);text-decoration:none;min-height:var(--hit)}
.crumbs{display:flex;gap:var(--sp-3);align-items:center;color:var(--crumb-fg);min-width:0;flex:1 1 auto;order:3;width:100%}
.crumbs a{color:var(--crumb-link);display:inline-flex;align-items:center;min-height:var(--hit)}
.crumbs a:hover{text-decoration:underline}
.crumbs .full{display:none}
.crumbs .cur{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.crumbs .trunc{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user{margin-left:auto}
.user button{gap:var(--sp-3);border-color:transparent;background:transparent}
.user button:hover{background:var(--btn-bg-hover);border-color:var(--btn-bd)}
.chip{font-size:var(--text-xs);color:var(--text-muted)}

/* buttons */
.btn{min-height:var(--btn-h);padding:0 var(--btn-px);border:var(--rule-w) solid var(--btn-bd);border-radius:var(--btn-radius);background:var(--btn-bg);color:var(--btn-fg);font:inherit;cursor:pointer;display:inline-flex;gap:var(--sp-3);align-items:center;justify-content:center;transition:background var(--dur-fast) var(--ease)}
.btn:hover{background:var(--btn-bg-hover)}
.btn:active{box-shadow:inset 0 0 0 1px var(--btn-fg)}
.btn[aria-pressed=true]{background:var(--cell-sel-bg);box-shadow:inset 0 0 0 1px var(--btn-fg);font-weight:600}
.btn.primary{background:var(--btn-primary-bg);border-color:var(--btn-primary-bg);color:var(--btn-primary-fg);font-weight:700}
.btn.primary:hover{background:var(--btn-primary-bg-hover);border-color:var(--btn-primary-bg-hover)}
.btn.primary:active{box-shadow:inset 0 0 0 1px var(--btn-primary-fg)}
.btn[aria-disabled=true]{background:var(--btn-off-bg);color:var(--btn-off-fg);border-color:var(--btn-off-bg);cursor:not-allowed}

/* layout (single column; sidebar becomes a column at 44em) */
.layout{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-5);padding:var(--sp-5);max-width:70em;margin:auto}
nav.side{min-width:0}
nav.side ul{list-style:none;margin:0;padding:0;display:flex;overflow-x:auto;background:var(--nav-bg);border:var(--rule-w) solid var(--nav-bd)}
nav.side a{display:flex;align-items:center;gap:var(--sp-3);min-height:var(--nav-h);padding:0 var(--sp-4);white-space:nowrap;color:var(--text);text-decoration:none;border-right:var(--rule-w) solid var(--nav-bd);border-bottom:3px solid transparent;transition:background var(--dur-fast) var(--ease)}
nav.side a:hover{background:var(--nav-bg-hover)}
nav.side a:focus-visible{outline-offset:-2px}
nav.side a[aria-current]{background:var(--nav-cur-bg);border-bottom-color:var(--nav-cur-mark);font-weight:600}
nav.side a[aria-disabled=true]{color:var(--nav-off-fg);cursor:not-allowed;background:transparent}
nav.side a small{font-size:var(--text-xs);color:var(--nav-off-fg);margin-left:var(--sp-2)}
nav.side .sep{display:none}
main{min-width:0;display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-5);align-content:start}
section,header.bh{background:var(--surface);border:var(--rule-w) solid var(--border);padding:var(--sp-4);min-width:0}
h1{font-size:var(--text-2xl);line-height:var(--leading-tight);margin:0;display:flex;flex-wrap:wrap;align-items:center;gap:var(--sp-3)}
h2 .stagename{text-transform:none;letter-spacing:0;font-weight:600;color:var(--text)}
h2{font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin:0 0 var(--sp-4);font-weight:700}

/* signature: status stamps; balls */
.stamp{display:inline-block;font:700 var(--text-xs)/1 var(--font-ui);letter-spacing:.08em;text-transform:uppercase;padding:3px 6px;border:var(--stamp-bd-w) solid currentColor;border-radius:0}
.s-passed{color:var(--status-passed-text)}.s-failed{color:var(--status-failed-text)}.s-running{color:var(--status-running-text)}.s-aborted{color:var(--status-aborted-text)}.s-idle{color:var(--status-idle-text)}
.stxt{font-size:var(--text-xs);letter-spacing:.08em;text-transform:uppercase;font-weight:700}
.ball{width:var(--ball-size);height:var(--ball-size)}.ball.lg{width:var(--ball-size-lg);height:var(--ball-size-lg)}
.spin{transform-origin:8px 8px;animation:spin var(--spin) linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* header */
.hd{display:grid;gap:var(--sp-4)}
.cta{display:grid;gap:var(--sp-2)}
.cta .row{display:grid;gap:var(--sp-3)}
.cta small{color:var(--text-muted);font-size:var(--text-sm)}
.sum{margin:var(--sp-4) 0;font-weight:600;color:var(--status-failed-text);display:flex;gap:var(--sp-3);align-items:center}
dl{display:grid;grid-template-columns:minmax(0,1fr);gap:var(--sp-3) var(--sp-5);margin:0;padding-top:var(--sp-4);border-top:var(--rule-w) solid var(--border)}
dt{color:var(--text-muted);font-size:var(--text-xs);text-transform:uppercase;letter-spacing:.06em}
dd{margin:0;overflow-wrap:anywhere}

/* Stage View grid: shared borders, wraps instead of scrolling */
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(var(--cell-min),1fr));border-top:var(--rule-w) solid var(--cell-bd);border-left:var(--rule-w) solid var(--cell-bd)}
.cell{min-height:var(--hit);border:0;border-right:var(--rule-w) solid var(--cell-bd);border-bottom:var(--rule-w) solid var(--cell-bd);border-top:3px solid transparent;margin-top:-1px;border-radius:0;padding:var(--sp-3) var(--sp-4);display:grid;gap:var(--sp-2);justify-items:start;align-content:start;background:var(--cell-bg);color:var(--text);font:inherit;text-align:left;cursor:pointer;min-width:0;transition:background var(--dur-fast) var(--ease)}
.cell:hover{background:var(--cell-bg-hover)}
.cell:hover .nm{text-decoration:underline}
.cell:focus-visible{outline-offset:-4px}
.cell .row{display:flex;gap:var(--sp-3);align-items:center;font-weight:600;max-width:100%}
.cell .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cell small{color:var(--text-muted);font-size:var(--text-sm);display:flex;flex-wrap:wrap;gap:var(--sp-1) var(--sp-3);align-items:center}
.cell[aria-pressed=true]{background:var(--cell-sel-bg);box-shadow:inset 0 0 0 2px var(--cell-sel-ring)}
.cell.failed{background:var(--cell-failed-bg);border-top-color:var(--cell-failed-rule)}
.cell.failed[aria-pressed=true]{box-shadow:inset 0 0 0 2px var(--cell-failed-ring)}

/* console */
.logbar{display:flex;flex-wrap:wrap;gap:var(--sp-3);align-items:center;margin-bottom:var(--sp-3)}
.search{flex:1 1 100%;display:flex;align-items:center;gap:var(--sp-3);min-height:var(--field-h);padding:0 var(--sp-3);border:var(--rule-w) solid var(--field-bd);border-radius:var(--btn-radius);background:var(--field-bg);color:var(--field-fg)}
.search:hover{border-color:var(--text)}
.search:focus-within{outline:var(--focus-ring-width) solid var(--focus-ring);outline-offset:var(--focus-ring-offset);border-color:var(--text)}
.search input{flex:1;min-width:0;border:0;background:transparent;color:inherit;font:inherit;outline:var(--focus-ring-width) solid transparent;min-height:calc(var(--field-h) - 2px)}
.search input::placeholder{color:var(--field-hint);opacity:1}
.hits{color:var(--text-muted);font-size:var(--text-sm);white-space:nowrap}
.inline-actions{display:none;gap:var(--sp-3)}
details.more{position:relative}
details.more>summary{list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more .menu{position:absolute;right:0;top:calc(100% + var(--sp-2));z-index:2;min-width:200px;display:grid;background:var(--dialog-bg);border:var(--rule-w) solid var(--dialog-bd);box-shadow:var(--dialog-shadow)}
details.more .menu .btn{justify-content:flex-start;border:0;border-bottom:var(--rule-w) solid var(--border);border-radius:0}
details.more .menu .btn:last-child{border-bottom:0}
